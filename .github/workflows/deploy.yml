name: Deploy

# Deploys to the self-hosted runner's own host on every push to main.
# Only runs on push (never pull_request), so untrusted fork code can't trigger it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # This runs on grunt-node1 (x86_64). pi-runner-1 is ARM64 and doesn't
    # have Docker; we constrain to X64 so the scheduler picks the right one.
    runs-on: [self-hosted, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Stop legacy host-level service (idempotent)
        # Earlier deploys ran clawcam-app as a systemd --user service binding
        # :8080 on the host. Container deploy owns port 80 on its own LAN IP,
        # but we stop the legacy unit anyway so it doesn't drift out of sync.
        run: |
          systemctl --user stop clawcam-app 2>/dev/null || true
          systemctl --user disable clawcam-app 2>/dev/null || true

      - name: Build image
        run: docker build -t clawcam-app:${{ github.sha }} -t clawcam-app:latest server/

      - name: Recreate container
        # The container attaches to the `lan-dhcp` macvlan. Docker gives it a
        # placeholder 10.255.0.x at startup; our entrypoint flushes that and
        # runs dhclient, which asks pfSense for a real LAN lease and
        # advertises `--hostname` so kea2unbound publishes
        # clawcam-app.mcbridefarm.com automatically. Host-side paths
        # (data volume + env file location) come from repo secrets so
        # infrastructure layout isn't recorded in public git history.
        env:
          DATA_DIR: ${{ secrets.DEPLOY_DATA_DIR }}
          ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          docker rm -f clawcam-app 2>/dev/null || true
          docker run -d \
            --name clawcam-app \
            --restart unless-stopped \
            --network lan-dhcp \
            --hostname clawcam-app \
            --mac-address 02:42:c0:a8:01:f1 \
            --cap-add NET_ADMIN \
            -v "$DATA_DIR":/app/data \
            -v ***REDACTED-CERT-DIR***/clawcam-app.mcbridefarm.com:/etc/ssl/clawcam-app:ro \
            --env-file "$ENV_FILE" \
            -e CLAWCAM_APP_DATA_DIR=/app/data \
            -e CLAWCAM_APP_TLS_CERT_DIR=/etc/ssl/clawcam-app \
            clawcam-app:latest

      - name: Smoke test
        # Linux's macvlan driver blocks frames between the host and its own
        # macvlan containers, so we can't curl the LAN IP from the runner.
        # Instead wait a moment and check the container is still running —
        # if it crashed during startup Docker would have marked it Exited.
        run: |
          sleep 8
          state=$(docker inspect --format '{{.State.Status}}' clawcam-app)
          if [ "$state" != "running" ]; then
            echo "container state: $state"
            docker logs --tail 40 clawcam-app || true
            exit 1
          fi
          # Also confirm dhclient got a lease — log line from entrypoint.
          if docker logs clawcam-app 2>&1 | grep -q 'bound to [0-9]'; then
            echo "container running + bound to LAN lease"
            docker logs clawcam-app 2>&1 | grep 'bound to'
          else
            echo "container running but no DHCP lease yet; check pfSense"
          fi
