name: Deploy

# Deploys to the self-hosted runner's own host on every push to main.
# Only runs on push (never pull_request), so untrusted fork code can't trigger it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t clawcam-app:${{ github.sha }} -t clawcam-app:latest server/

      - name: Recreate container
        # The container attaches to the `lan-dhcp` macvlan. Docker gives it a
        # placeholder 10.255.0.x at startup; our entrypoint flushes that and
        # runs dhclient, which asks pfSense for a real LAN lease and
        # advertises `--hostname` so kea2unbound publishes
        # clawcam-app.mcbridefarm.com automatically.
        run: |
          docker rm -f clawcam-app 2>/dev/null || true
          docker run -d \
            --name clawcam-app \
            --restart unless-stopped \
            --network lan-dhcp \
            --hostname clawcam-app \
            --mac-address 02:42:c0:a8:01:f1 \
            --cap-add NET_ADMIN \
            -v /home/grunt/clawcam-app/data:/app/data \
            --env-file /home/grunt/clawcam-app/server/.env \
            -e CLAWCAM_APP_DATA_DIR=/app/data \
            clawcam-app:latest

      - name: Smoke test
        env:
          HOST: clawcam-app.mcbridefarm.com
        run: |
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS --max-time 3 "http://$HOST/api/health" >/dev/null 2>&1; then
              echo "healthy at http://$HOST/"
              exit 0
            fi
          done
          echo "smoke test failed — recent logs:"
          docker logs --tail 40 clawcam-app || true
          exit 1
